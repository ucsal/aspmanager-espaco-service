spring.application.name=microservice-espaco
server.port=8084
spring.application.name=MICROSERVICE-ESPACO

# BD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_espaco}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:asp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:asp123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# EUREKA
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info